<div class="w-full p-2">
    <div class="rounded shadow-md p-3 border">
        <div class="flex items-center justify-between">
            <h3 class="text-blue-600 text-2xl font-bold mb-3">Liste des tests</h3>
           
        </div>
       
        <table class="w-full">
            <thead>
                <th class="border text-left  p-2">Titre</th>
                <th class="border text-left  p-2">Nombre de questions</th>
                  <th class="border text-left  p-2">Actions</th>
            </thead>
            <tbody>
                <tr *ngFor="let test of tests">
                    <td class="border  p-2">{{ test.title }}</td>
                    <td class="border  p-2">{{ test?.questions?.length }}</td>
                    <td class="border flex gap-2  p-2">
                        <a class="bg-red-600 text-white p-2"  (click)="deleteTest(test.id)">Supprimer</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
    </div>
  
</div>
