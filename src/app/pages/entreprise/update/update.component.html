<div>
    <h3 class="py-3 text-2xl font-bold text-center">Modifier les informations de l'entreprise</h3>
    <form #enterpriseForm="ngForm" (ngSubmit)="updateEnterprise()" class="max-w-3xl mx-auto mt-10 p-6 border rounded-lg shadow-lg">
        <div class="mb-4">
          <label for="name" class="block text-sm font-medium text-gray-700">Nom de l'entreprise</label>
          <input
            type="text"
            id="name"
            name="name"
            class="mt-1 p-2 w-full border border-gray-300 rounded-md"
            [(ngModel)]="enterprise.name"
            required
          />
          <div *ngIf="enterpriseForm.controls['name']?.invalid && enterpriseForm.controls['name']?.touched" class="text-red-500 text-xs">
            Le nom de l'entreprise est requis.
          </div>
        </div>
      
        <div class="mb-4">
          <label for="description" class="block text-sm font-medium text-gray-700">Description</label>
          <textarea
            id="description"
            name="description"
            class="mt-1 p-2 w-full border border-gray-300 rounded-md"
            rows="4"
            [(ngModel)]="enterprise.description"
            required
          ></textarea>
          <div *ngIf="enterpriseForm.controls['description']?.invalid && enterpriseForm.controls['description']?.touched" class="text-red-500 text-xs">
            La description est requise.
          </div>
        </div>
      
        <div class="mb-4">
          <label for="activityField" class="block text-sm font-medium text-gray-700">Domaine d'activité</label>
          <input
            type="text"
            id="activityField"
            name="activityField"
            class="mt-1 p-2 w-full border border-gray-300 rounded-md"
            [(ngModel)]="enterprise.activityField"
            required
          />
          <div *ngIf="enterpriseForm.controls['activityField']?.invalid && enterpriseForm.controls['activityField']?.touched" class="text-red-500 text-xs">
            Le domaine d'activité est requis.
          </div>
        </div>
      
        <div class="mb-4">
          <label for="address" class="block text-sm font-medium text-gray-700">Adresse</label>
          <input
            type="text"
            id="address"
            name="address"
            class="mt-1 p-2 w-full border border-gray-300 rounded-md"
            [(ngModel)]="enterprise.address"
            required
          />
          <div *ngIf="enterpriseForm.controls['address']?.invalid && enterpriseForm.controls['address']?.touched" class="text-red-500 text-xs">
            L'adresse est requise.
          </div>
        </div>
      
        <div class="mb-4">
          <label for="phone" class="block text-sm font-medium text-gray-700">Numéro</label>
          <input
            type="text"
            id="phone"
            name="phone"
            class="mt-1 p-2 w-full border border-gray-300 rounded-md"
            [(ngModel)]="enterprise.phone"
            required
          />
          <div *ngIf="enterpriseForm.controls['phone']?.invalid && enterpriseForm.controls['phone']?.touched" class="text-red-500 text-xs">
            Le numéro est requis.
          </div>
        </div>
      
        <div class="mb-4">
          <label for="facebook" class="block text-sm font-medium text-gray-700">Page Facebook</label>
          <input
            type="url"
            id="facebook"
            name="facebook"
            class="mt-1 p-2 w-full border border-gray-300 rounded-md"
            [(ngModel)]="enterprise.facebook"
          />
        </div>
      
        <div class="mb-4">
          <label for="linkedin" class="block text-sm font-medium text-gray-700">Page LinkedIn</label>
          <input
            type="url"
            id="linkedin"
            name="linkedin"
            class="mt-1 p-2 w-full border border-gray-300 rounded-md"
            [(ngModel)]="enterprise.linkedin"
          />
        </div>
      
        <div class="mb-4">
          <label for="website" class="block text-sm font-medium text-gray-700">Site Web</label>
          <input
            type="url"
            id="website"
            name="website"
            class="mt-1 p-2 w-full border border-gray-300 rounded-md"
            [(ngModel)]="enterprise.website"
          />
        </div>
      
        <div class="mb-4">
          <label for="email" class="block text-sm font-medium text-gray-700">E-mail</label>
          <input
            type="email"
            id="email"
            name="email"
            class="mt-1 p-2 w-full border border-gray-300 rounded-md"
            [(ngModel)]="enterprise.email"
            required
          />
          <div *ngIf="enterpriseForm.controls['email']?.invalid && enterpriseForm.controls['email']?.touched" class="text-red-500 text-xs">
            L'e-mail est requis et doit être valide.
          </div>
        </div>
      
        <button
          type="submit"
          [disabled]="enterpriseForm.invalid"
          class="mt-4 w-full bg-blue-500 text-white p-2 rounded-md hover:bg-blue-600 focus:outline-none"
        >
        Mettre à jour 
        </button>
      </form>
      
      
</div>
