<div class="w-full p-2">
    <div class="rounded shadow-md p-3 border">
        <div class="flex items-center justify-between">
            <h3 class="text-blue-600 text-2xl font-bold mb-3">Liste des offres</h3>
          
        </div>
       
        <table class="w-full">
            <thead>
                <th class="border text-left  p-2">Titre</th>
                <th class="border text-left  p-2">Categorie</th>
                <th class="border text-left  p-2">Nombre des candidatures</th>
                <th class="border text-left  p-2">Actions</th>
            </thead>
            <tbody>
                <tr *ngFor="let offer of offers">
                    <td class="border  p-2">{{ offer.title }}</td>
                    <td class="border  p-2">
                        <span class="text-sm text-green-500 rounded border p-2">
                            {{ offer?.category?.title }}
                        </span>
                       </td>
                  <td class="border  p-2">{{ offer?.candidatures?.length  }}</td>
                    <td class="border flex gap-2  p-2">
                        <a class="bg-red-600 text-white p-2"  (click)="deleteOffer(offer.id)">Supprimer</a>
                    </td>
                </tr>
            </tbody>
        </table>
        
    </div>
  
</div>
