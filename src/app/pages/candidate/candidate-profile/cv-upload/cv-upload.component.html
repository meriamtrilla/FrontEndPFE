<div class="border shadow-md p-4 rounded mt-3">
    <h3 class="font-bold text-2xl mb-3">Joignez votre CV.</h3>
    <hr />
    <p class="my-3">Utilisez notre outil pour générer le vôtre et mettre en avant vos compétences et votre expérience de manière professionnelle.</p>
  
    <!-- Formulaire de téléchargement de CV avec un champ d'entrée de fichier -->
    <input type="file" (change)="onFileSelected($event)" accept=".pdf" required />
    <button (click)="uploadCv()" class="bg-blue-600 text-white px-3.5 py-2 mt-4 rounded">Télécharger votre CV</button>
  
    <!-- Affichage des données extraites du CV après téléchargement -->
    <div *ngIf="cvData && cvData.name">

      <h3 class="mt-3 font-bold text-xl">Données extraites du CV :</h3>
      <form #cvForm="ngForm">
        <div>
          <label for="name">Nom :</label>
          <input type="text" id="name" [(ngModel)]="cvData.name" name="name" required />
        </div>
        <div>
          <label for="email">Email :</label>
          <input type="email" id="email" [(ngModel)]="cvData.email" name="email" required />
        </div>
        <div>
          <label for="languages">Langues :</label>
          <input type="text" id="languages" [(ngModel)]="cvData.languages" name="languages" />
        </div>
        <div>
          <label for="skills">Compétences :</label>
          <input type="text" id="skills" [(ngModel)]="cvData.skills" name="skills" />
        </div>
  
        <button (click)="saveData()" class="bg-green-600 text-white px-3.5 py-2 mt-4 rounded">Enregistrer les informations</button>
      </form>
    </div>
  </div>
