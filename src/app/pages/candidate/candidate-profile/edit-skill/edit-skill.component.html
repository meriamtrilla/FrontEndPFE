<div class="max-w-lg mx-auto">
    <h3 class="font-bold text-2xl text-center mb-8">Modifier competence</h3>

    <form #formSkill="ngForm" (submit)="updateSkill(formSkill)">
        <div class="mb-4">
            <label for="email" class="block text-gray-400 mb-2">Nom de compétence</label>
            <input type="text" id="skillName" class="w-full p-2 border rounded" name="name" [(ngModel)]="skill.name" required />
        </div>

        
        
        <div class="mb-4">
            <label for="email" class="block text-gray-400 mb-2">Niveau</label>
            <select class="w-full p-2 border rounded" name="level" [(ngModel)]="skill.level">
                <option value="Debutante">Debutante</option>
                <option value="Moyen">Moyen</option>
                <option value="Expert">Expert</option>
            </select>
           
        </div>

        <button type="submit" class="bg-blue-600 text-white rounded-md px-3.5 py-1.5">Mettre a jour</button>
    </form>

</div>
