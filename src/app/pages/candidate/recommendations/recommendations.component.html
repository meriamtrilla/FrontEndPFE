<div class="max-w-4xl mx-auto">
    <h3 class="text-2xl font-bold">Offres Recommandées</h3>
    <p class="text-gray-600">offres compatible avec votre profile</p>

    <div class="rounded-md border flex items-center relative my-5"   *ngFor="let offer of offers" >
        <a routerLink="/candidate/show-offer/{{ offer.id }}" class="more border rounded-md bg-gray-200 text-gray-600 px-2 py-1.5 font-semibold text-sm hover:bg-gray-300">Voir plus</a>
        <img src="assets/offer.png" alt="" class="w-48">
        <div class="p-4">
               <h2 class="text-2xl font-medium my-2">{{ offer.title }}</h2> 
               <p class="text-gray-400 text-md mb-4">{{ offer.description }}</p>
              <div class="flex items-center gap-8 text-sm text-gray-600">
                <h3><span class="fa fa-building text-blue-600"></span> HR Bee coders</h3>
                <h3><span class="fa fa-location-dot text-blue-600"></span> Technopole Elghazala</h3>
            
              </div>
                
        </div>

    </div>

</div>
