<div class="w-1/2 mx-auto shadow-md p-4 mt-16 login-container">
    <h2 class="text-xl font-bold mb-4 text-center">Connectez-vous à votre compte.</h2>
    <p class="text-center">Vous n'avez pas encore de compte ? <a routerLink="/guest/register"
            class="text-blue-600 font-medium">Inscrivez-vous ici</a></p>
    <form #loginForm="ngForm" (ngSubmit)="login(loginForm)">
        <div class="mb-4">
            <label for="email" class="block text-gray-700">Email : *</label>
            <input type="email" id="email" name="username" ngModel class="w-full p-2 border rounded" placeholder="Votre email ..." required />
        </div>
        <div class="mb-2">
            <label for="password" class="block text-gray-700">Mot de passe : *</label>
            <input type="password" id="password" ngModel name="password" class="w-full p-2 border rounded" placeholder="Votre mot de passe ..."
                required>
        </div>
        <div class="text-end mb-4">
            <a routerLink="/guest/register" class="text-blue-600 font-medium">Mot de passe oublie</a>


        </div>
        <button type="submit" class="btn login">Connecter</button>
    </form>
</div>
