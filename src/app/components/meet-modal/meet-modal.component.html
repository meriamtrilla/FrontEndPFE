<!-- Backdrop -->
<div
  class="fixed inset-0 z-50 flex items-center justify-center bg-black bg-opacity-50"
  *ngIf="isOpen"
>
  <!-- Modal Content -->
  <div class="bg-white rounded-lg shadow-lg p-6 max-w-lg w-full animate-fade-in">
    <!-- Modal Header -->
    <div class="flex justify-between items-center border-b pb-2">
      <h3 class="text-lg font-semibold text-blue-600">{{ title }}</h3>
      <button
        (click)="closeModal()"
        class="text-gray-400 hover:text-gray-600 focus:outline-none"
      >
        &times;
      </button>
    </div>

    <!-- Modal Body with Textarea -->
    <div class="my-4">
      <label for="motivation" class="block text-gray-700 font-medium mb-2">
        Nom de reunion :
      </label>
      <input
       
        [(ngModel)]="reunion.name"
        type="text"
        class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
        placeholder="Nom de reunion ..."
        />
    </div>
    <div class="my-4">
        <label for="motivation" class="block text-gray-700 font-medium mb-2">
          date de reunion :
        </label>
        <input
         
          [(ngModel)]="reunion.date"
          type="date"
          class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="date de reunion ..."
          />
      </div>
      <div class="my-4">
        <label for="motivation" class="block text-gray-700 font-medium mb-2">
          date de reunion :
        </label>
        <select
    
          [(ngModel)]="reunion.time"
          type="date"
          class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="date de reunion ..."
          >
        <option value="08h">08h</option>
        <option value="09h">09h</option>
        <option value="10h">10h</option>
        <option value="11h">11h</option>
        <option value="12h">12h</option>
        <option value="13h">13h</option>
        <option value="14h">14h</option>
      
        <option value="15h">15h</option>
        <option value="16h">16h</option>
        <option value="17h">17h</option>
        <option value="18h">18h</option>
        </select>
      </div>
      <div class="my-4">
        <label for="motivation" class="block text-gray-700 font-medium mb-2">
          Type de reunion :
        </label>
        <select
    
          [(ngModel)]="reunion.type"
         
          class="w-full p-3 border rounded focus:outline-none focus:ring-2 focus:ring-blue-500"
          placeholder="type de reunion ..."
          >
        <option value="PERSONAL">En personne </option>
        <option value="ONLINE">En ligne </option>
        
        </select>
      </div>

    <!-- Modal Footer -->
    <div class="flex justify-end space-x-2">
      <button
        (click)="closeModal()"
        class="px-4 py-2 bg-gray-300 text-gray-700 rounded hover:bg-gray-400"
      >
        Fermer
      </button>
      <button
        (click)="confirmAction()"
        class="px-4 py-2 bg-blue-600 text-white rounded hover:bg-blue-700"
      >
        Envoyer
      </button>
    </div>
  </div>
</div>
