<div class="w-full">
  
  
    <!-- Month Selector -->
    
    <select
      id="month"
      class="block w-full px-4 py-2 border rounded shadow focus:outline-none focus:ring-2 focus:ring-blue-500"
      (change)="onSelectMonth($event)"
      >
        <option value="" disabled>Select a month</option>
      <option
        *ngFor="let month of displayedMonths"
        [value]="month"
      >
        {{ month }}
      </option>
    </select>
  </div>
