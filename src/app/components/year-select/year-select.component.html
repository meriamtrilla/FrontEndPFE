<div class="w-full">
    
    <select
      id="year"
      class="block w-full px-4 py-2 border rounded shadow focus:outline-none focus:ring-2 focus:ring-blue-500"
      [value]="selectedYear"
    (change)="onSelectYear($event)"
  >
    <option value="" disabled>Select a year</option>
      <option *ngFor="let year of years" [value]="year">
        {{ year }}
      </option>
    </select>
  </div>
